services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-1536}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      MULTIVOZES_API_URL: ${MULTIVOZES_API_URL:-}
      MULTIVOZES_API_KEY: ${MULTIVOZES_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - default
      - coolify
    labels:
      - "coolify.managed=true"
      - "coolify.port=3000"
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.chatbot-backend.rule=Host(`chatbot.hneemias.cloud`) && (PathPrefix(`/api`) || PathPrefix(`/webhook`))"
      - "traefik.http.routers.chatbot-backend.entrypoints=https"
      - "traefik.http.routers.chatbot-backend.tls=true"
      - "traefik.http.routers.chatbot-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.chatbot-backend.loadbalancer.server.port=3000"

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-${SUPABASE_URL}}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-${SUPABASE_URL}}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:3000}
      BACKEND_PUBLIC_WEBHOOK_URL: ${BACKEND_PUBLIC_WEBHOOK_URL:-https://chatbot.hneemias.cloud/webhook/evolution}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/painel/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - coolify
    labels:
      - "coolify.managed=true"
      - "coolify.port=3001"
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.chatbot-panel.rule=Host(`chatbot.hneemias.cloud`) && PathPrefix(`/painel`)"
      - "traefik.http.routers.chatbot-panel.entrypoints=https"
      - "traefik.http.routers.chatbot-panel.tls=true"
      - "traefik.http.routers.chatbot-panel.tls.certresolver=letsencrypt"
      - "traefik.http.services.chatbot-panel.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.chatbot-root-redirect.redirectregex.regex=^https?://chatbot\\.hneemias\\.cloud/?$$"
      - "traefik.http.middlewares.chatbot-root-redirect.redirectregex.replacement=https://chatbot.hneemias.cloud/painel"
      - "traefik.http.middlewares.chatbot-root-redirect.redirectregex.permanent=false"
      - "traefik.http.routers.chatbot-root.rule=Host(`chatbot.hneemias.cloud`) && Path(`/`)"
      - "traefik.http.routers.chatbot-root.entrypoints=https"
      - "traefik.http.routers.chatbot-root.tls=true"
      - "traefik.http.routers.chatbot-root.tls.certresolver=letsencrypt"
      - "traefik.http.routers.chatbot-root.middlewares=chatbot-root-redirect"
      - "traefik.http.routers.chatbot-root.service=chatbot-panel"

volumes:
  redis_data:

networks:
  default:
  coolify:
    external: true
